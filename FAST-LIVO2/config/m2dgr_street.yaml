# -----------------------------
# 话题与模块开关
# -----------------------------
common:
    # rosbag 中的输入话题
    lid_topic:  "/velodyne_points"
    imu_topic:  "/handsfree/imu"
    img_topic:  "/camera/color/image_raw"

    # 1: 启用, 0: 关闭
    img_en: 1
    lidar_en: 1
    # 对部分 ROS 驱动的时间戳异常进行补偿
    ros_driver_bug_fix: true
    # true: 启用压缩图像回退订阅(适用于bag中只有compressed话题的情况)
    subscribe_compressed_fallback: true

# -----------------------------
# 传感器外参标定
# -----------------------------
extrin_calib:
  # LiDAR <-> IMU 外参 (T, R)
  extrinsic_T: [0.27255, -0.00053, 0.17954]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  # Camera <-> LiDAR 外参 (Rcl, Pcl)
  Rcl: [0.00000, -1.00000, 0.00000, 
        0.00000, 0.00000, -1.00000, 
        1.00000, 0.00000, 0.00000] 
  Pcl: [0.16123, -0.16711, -0.24221]

# -----------------------------
# 时间偏移补偿
# -----------------------------
time_offset:
  # 正值表示该传感器时间戳偏晚
  imu_time_offset:  0.0
  img_time_offset: 0.0
  # 直接法 VIO 的初始曝光时间估计
  exposure_time_init: 0.0

  # street 数据集时间补偿

# -----------------------------
# LiDAR 预处理
# -----------------------------
preprocess:
  # 特征处理前每 N 个点保留 1 个
  point_filter_num: 1
  # 面点体素下采样大小
  filter_size_surf: 0.25
  lidar_type: 2 # 1:Livox Avia LiDAR  2:VELO16  3:OUST64  4:XT32 
  scan_line: 32 # 16  64  32
  # 过滤 blind 米以内的近距离点
  blind: 1 #5         blind x m disable
  
# -----------------------------
# 视觉里程计（直接法）
# -----------------------------
vio:
  max_iterations: 5
  outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
  img_point_cov: 1000 # 100 1000 
  patch_size: 8
  patch_pyrimid_level: 3
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

# -----------------------------
# IMU 模型与初始化
# -----------------------------
imu:
  imu_en: true
  # IMU 初始化使用的帧数
  imu_int_frame: 30
  acc_cov: 0.1 # 0.5 2.0
  gyr_cov: 0.1 # 0.3
  b_acc_cov: 0.0001 # 0.1
  b_gyr_cov: 0.0001 # 0.1

  #acc_cov_scale: 100
  #gyr_cov_scale: 10000

# -----------------------------
# LiDAR 里程计与体素地图
# -----------------------------
lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.001
  voxel_size: 1.5 # 更大体素可降低点数与内存压力
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

# -----------------------------
# 局部地图滑窗
# -----------------------------
local_map:
  map_sliding_en: false
  half_map_size: 100 #100
  sliding_thresh: 8 #8

# -----------------------------
# UAV 场景选项
# -----------------------------
uav:
  imu_rate_odom: false
  gravity_align_en: false

# -----------------------------
# 运行时发布选项
# -----------------------------
publish:
  # 稠密地图发布更多点，但占用更多内存
  dense_map_en: false
  pub_effect_point_en: false 
  pub_plane_en: false
  # 每 N 帧发布一次
  pub_scan_num: 2
  blind_rgb_points: 0.0

# -----------------------------
# 轨迹输出
# -----------------------------
evo:
  #seq_name: "HKairport03"
  seq_name: "street_03_prism"
  pose_output_en: true

# -----------------------------
# PCD 导出选项
# -----------------------------
pcd_save:
  # 是否启用 PCD 地图保存
  pcd_save_en: true
  # 是否启用 COLMAP 导出；通常要求 interval = -1
  colmap_output_en: false # need to set interval = -1
  # 导出 PCD 前的下采样体素大小
  filter_size_pcd: 0.15
  # -1: 退出时仅保存最终地图；>0: 按间隔分段保存
  interval: -1
